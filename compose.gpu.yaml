# NVIDIA GPU for Ollama. Use with:
#   docker compose -f compose.yaml -f compose.gpu.yaml up -d
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
