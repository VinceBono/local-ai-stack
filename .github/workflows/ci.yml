name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker compose -f compose.yaml -f compose.gpu.yaml -f compose.vllm.yaml config -q
      - run: bash -n scripts/smoke.sh
      - run: python3 scripts/commitguard.py --all
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/smoke.sh
        env:
          MODEL: smollm2:135m
